server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/community_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 1500
      validation-timeout: 1000
      connection-init-sql: SET SESSION innodb_lock_wait_timeout = 2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
mall:
  jwt-secret: change-this-secret-to-a-long-random-value-for-production
  jwt-expire-hours: 24
  seckill:
    max-concurrency: 24
  payment:
    mode: unconfigured
    alipay:
      enabled: false
      gateway-url: https://openapi.alipay.com/gateway.do
      app-id: ${ALIPAY_APP_ID:}
      private-key: ${ALIPAY_PRIVATE_KEY:}
      public-key: ${ALIPAY_PUBLIC_KEY:}
      notify-url: ${ALIPAY_NOTIFY_URL:}
    wechat:
      enabled: false
      app-id: ${WECHAT_APP_ID:}
      mch-id: ${WECHAT_MCH_ID:}
      private-key-path: ${WECHAT_PRIVATE_KEY_PATH:}
      merchant-serial-number: ${WECHAT_MERCHANT_SERIAL_NUMBER:}
      api-v3-key: ${WECHAT_API_V3_KEY:}
      notify-url: ${WECHAT_NOTIFY_URL:}
